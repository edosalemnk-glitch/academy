{% extends "base.html" %}{% block title %}Connexion{% endblock %}
{% block content %}
<h1>Connexion</h1>
<form method="post" class="card form">{{ csrf_field() }}
  <label for="email">Adresse e-mail</label><input id="email" type="email" name="email" required autofocus>
  <label for="password">Mot de passe</label><input id="password" type="password" name="password" required>
  <p><button class="btn">Se connecter</button></p>
  <p class="hint">Pas encore de compte ? <a href="{{ url_for('register') }}">Créez-en un gratuitement</a>. Si votre formateur vous a créé un compte, utilisez le mot de passe temporaire reçu.</p>
</form>
{% endblock %}
