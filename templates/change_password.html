{% extends "base.html" %}{% block title %}Mot de passe{% endblock %}
{% block content %}
<h1>Changer de mot de passe</h1>
{% if g.user.must_change_password %}<div class="flash warn">Pour votre sécurité, remplacez le mot de passe temporaire avant de continuer.</div>{% endif %}
<form method="post" class="card form">{{ csrf_field() }}
  <label for="o">Mot de passe actuel</label><input id="o" type="password" name="old" required>
  <label for="n">Nouveau mot de passe (8 caractères minimum)</label><input id="n" type="password" name="new" required minlength="8">
  <label for="c">Confirmer le nouveau mot de passe</label><input id="c" type="password" name="confirm" required minlength="8">
  <p><button class="btn">Enregistrer</button></p>
</form>
{% endblock %}
