services:
  - type: web
    name: inpp-academie
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEO_BASE_URL
        sync: false
      - key: INPP_ENFORCE_FEES
        value: "1"
      - key: INPP_SEED_DEMO
        value: "0"
      - key: INPP_RESTORE_DEMO
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "inpp-uploads"
      - key: SUPABASE_STORAGE_SIGNED_TTL
        value: "3600"
